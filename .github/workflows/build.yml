name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Cài XcodeGen
        run: brew install xcodegen
      - name: Tạo dự án
        run: xcodegen generate
      - name: Chọn máy ảo iPhone để chạy test
        id: sim
        run: |
          xcrun simctl list devices available | tee /tmp/simctl.txt || true
          UDID=$(grep -i iphone /tmp/simctl.txt | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)
          if [ -z "$UDID" ]; then
            echo "Không có máy ảo iPhone sẵn có, tạo mới"
            RUNTIME=$(xcrun simctl list runtimes available | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1)
            TYPE=$(xcrun simctl list devicetypes | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-[0-9A-Za-z-]+' | tail -1)
            echo "runtime=$RUNTIME devicetype=$TYPE"
            UDID=$(xcrun simctl create "May test" "$TYPE" "$RUNTIME")
          fi
          echo "Dùng UDID máy ảo: $UDID"
          echo "dest=platform=iOS Simulator,id=$UDID" >> "$GITHUB_OUTPUT"
      - name: Chạy test đơn vị (SSE/giải mã JSON/phân trang/gộp ngày - không cần mạng)
        run: |
          xcodebuild test -project ZaloLuuTru.xcodeproj -scheme ZaloLuuTru \
            -destination "${{ steps.sim.outputs.dest }}" CODE_SIGNING_ALLOWED=NO
      - name: Build (không ký - ESign ký lại)
        run: |
          xcodebuild -project ZaloLuuTru.xcodeproj -scheme ZaloLuuTru -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Đóng gói IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ZaloLuuTru.app Payload/
          zip -qry ZaloLuuTru.ipa Payload
          ls -la ZaloLuuTru.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ZaloLuuTru-ipa
          path: ZaloLuuTru.ipa
