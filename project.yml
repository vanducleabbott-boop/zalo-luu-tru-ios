name: ZaloLuuTru
options:
  bundleIdPrefix: com.ducle
  deploymentTarget:
    iOS: "16.0"
targets:
  ZaloLuuTru:
    type: application
    platform: iOS
    sources: [App, Shared]
    # v7.1: bỏ nhúng ZaloShare - chứng chỉ Ad Hoc 1 App ID không chạy được tiện ích; nhận tệp qua CFBundleDocumentTypes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.guava948.kale5858.cf
        PRODUCT_NAME: ZaloLuuTru
        MARKETING_VERSION: "8.4"
        CURRENT_PROJECT_VERSION: "90"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconCF2
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Zalo CF"
        ZLTKenh: cf
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: "Theo dõi vị trí (độ chính xác thấp) chỉ để giữ app chạy nền, không bỏ lỡ cuộc gọi Zalo. Vị trí không gửi đi đâu."
        NSLocationDefaultAccuracyReduced: true
        NSLocationAlwaysAndWhenInUseUsageDescription: "Chọn \"Luôn luôn\" để app chạy nền liên tục, không bỏ lỡ cuộc gọi Zalo. Vị trí không gửi đi đâu."
        NSMicrophoneUsageDescription: "Dùng micro để quay video và nghe gọi Zalo."
        NSCameraUsageDescription: "Dùng camera để chụp ảnh và quay video gửi Zalo."
        NSPhotoLibraryUsageDescription: "Chọn ảnh để gửi Zalo."
        NSPhotoLibraryAddUsageDescription: "Lưu ảnh từ Zalo về máy."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [zalo]
        NSUserActivityTypes: [INSendMessageIntent]
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Tệp"
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.item, public.data, public.content]
  ZaloShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.guava948.kale5858.cf.share
        PRODUCT_NAME: ZaloShare
        MARKETING_VERSION: "8.4"
        CURRENT_PROJECT_VERSION: "90"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: "Zalo CF"
        ZLTKenh: cf
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            IntentsSupported: [INSendMessageIntent]
            # v8.1: dạng chuỗi SUBQUERY (dạng từ điển cũ: video từ app Ảnh không hiện Zalo lưu trữ trong bảng Chia sẻ)
            NSExtensionActivationRule: "SUBQUERY(extensionItems, $e, SUBQUERY($e.attachments, $a, ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.movie\" OR ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO \"com.apple.quicktime-movie\" OR ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.mpeg-4\" OR ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.image\" OR ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.data\" OR ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.file-url\" OR ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.url\" OR ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.plain-text\").@count >= 1).@count >= 1"
  ZaloAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ZaloAppTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ducle.zaloluutru.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ZaloLuuTru
schemes:
  ZaloLuuTru:
    build:
      targets:
        ZaloLuuTru: all
        ZaloAppTests: [test]
    test:
      targets: [ZaloAppTests]
